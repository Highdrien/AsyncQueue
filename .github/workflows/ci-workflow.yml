name: CI Workflow

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.6

      - name: Install UV
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run linting
        run: |
          uvx ruff check
          uvx flake8 .
          uvx black . --check
          uvx isort . --check
          uvx mypy . --explicit-package-bases

      - name: Run tests
        run: uv run pytest
