[project]
name = "asyncqueue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "pre-commit>=4.6.2",
    "pytest>=8.3.4",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]


[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
minversion = "8.3"
addopts = "--strict-markers --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:coroutine 'echo' was never awaited:RuntimeWarning"
]

[tool.coverage.run]
source = ["src/asyncqueue"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
