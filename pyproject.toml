[project]
name = "asyncqueue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "pre-commit>=4.6.2",
    "pytest>=8.3.4",
    "ruff>=0.16.8",
]


[tool.pytest.ini_options]
minversion = "8.3"
addopts = "--strict-markers --disable-warnings"
pythonpath = "."
testpaths = "tests"

