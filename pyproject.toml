[project]
name = "asyncbatcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "pytest>=8.3.4",
]


[tool.pytest.ini_options]
minversion = "8.3"
addopts = "--strict-markers --disable-warnings"
pythonpath = "."
testpaths = "tests"

[tool.ruff]
exclude = [
    ".git", "__pycache__", ".venv"
]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.isort]
profile = "black"
line_length = 88
skip = [".venv"]
