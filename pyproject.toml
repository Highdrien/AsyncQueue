[project]
name = "asyncqueue-py"
version = "0.1.0"
description = "Run coroutines with bounded concurrency: a new task starts as soon as one finishes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Highdrien" }]
keywords = ["asyncio", "async", "queue", "concurrency", "task-queue", "worker-pool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Highdrien/AsyncQueue"
Repository = "https://github.com/Highdrien/AsyncQueue"
Issues = "https://github.com/Highdrien/AsyncQueue/issues"

# The distribution is `asyncqueue-py` on PyPI, but the module stays `asyncqueue`:
# `pip install asyncqueue-py` then `import asyncqueue`.
[tool.uv.build-backend]
module-name = "asyncqueue"

[build-system]
requires = ["uv_build>=0.10.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "pre-commit>=4.6.2",
    "pytest>=8.3.4",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]


[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
minversion = "8.3"
addopts = "--strict-markers --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:coroutine 'echo' was never awaited:RuntimeWarning"
]

[tool.coverage.run]
source = ["src/asyncqueue"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
